<!-- ===================== CINEMATIC INTRO ===================== -->
<div id="wam-intro" role="dialog" aria-label="Warm Alpine Modern — intro experience">

  <!-- 3D space flight -->
  <canvas id="wam-cosmos-canvas" aria-hidden="true"></canvas>

  <!-- continuous dive through the Rockies into Lakewood -->
  <div class="wam-descent" aria-hidden="true">
    <div class="wam-descent__layer wam-descent--rockies"></div>
    <div class="wam-descent__layer wam-descent--lakewood"></div>
    <div class="wam-descent__haze"></div>
  </div>
  <div class="wam-place" aria-hidden="true"><span>Lakewood, Colorado</span></div>
  <div class="wam-white" aria-hidden="true"></div>

  <!-- fly-through of the real renders -->
  <div class="wam-scenes" aria-hidden="true">
    <div class="wam-scene" data-img="87d52af9-01de-443c-b71e-043e1cbcb038"><div class="wam-scene__img"></div></div>
    <div class="wam-scene" data-img="efebd6bf-a03f-404c-b166-da2c0eda4573"><div class="wam-scene__img"></div></div>
    <div class="wam-scene" data-img="6f0de1ec-dc45-4d15-9559-28ec9a27957d"><div class="wam-scene__img"></div></div>
    <div class="wam-scene" data-img="42f76987-24b9-4cc9-9ba7-ad7c70cdbd81"><div class="wam-scene__img"></div></div>
    <div class="wam-scene" data-img="51c34cd5-58ef-4968-844d-805ae66b86a6"><div class="wam-scene__img"></div></div>
  </div>

  <div class="wam-tint" aria-hidden="true"></div>
  <div class="wam-scrim" aria-hidden="true"></div>
  <div class="wam-flash" aria-hidden="true"></div>
  <div class="wam-embers" aria-hidden="true"></div>

  <div class="wam-cap" aria-hidden="true">
    <p class="wam-cap__word"></p>
    <p class="wam-cap__sub"></p>
  </div>

  <div class="wam-dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

  <div class="wam-stage">
    <div class="wam-lockup">
      <p class="wam-eyebrow">House mood board</p>
      <h1 class="wam-title">Warm Alpine Modern</h1>
      <p class="wam-sub">A bright white shell, warmed with honey wood, velvet, leather &amp; brass.<br>Sleek by day. Glowing by night.</p>
      <button type="button" id="wam-enter" class="wam-enter">
        Enter
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m0 0l-6-6m6 6l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <button type="button" id="wam-skip" class="wam-skip">Skip ↦</button>
</div>

<!-- ===================== THEATER REVEAL (on Enter) ===================== -->
<div id="wam-theater" aria-hidden="true">
  <div class="wam-th-glow" aria-hidden="true"></div>
  <div class="wam-valance" aria-hidden="true"></div>
  <div class="wam-marquee">
    <div class="wam-marquee__row" aria-hidden="true"></div>
    <div class="wam-marquee__text"><span class="wam-marquee__a">Arriel&rsquo;s</span><span class="wam-marquee__b">Founding Clients</span></div>
    <div class="wam-marquee__row" aria-hidden="true"></div>
  </div>
  <div class="wam-curtain wam-curtain--l" aria-hidden="true"></div>
  <div class="wam-curtain wam-curtain--r" aria-hidden="true"></div>
</div>

<!-- ===================== TOP BAR ===================== -->
<header id="wam-topbar" aria-hidden="true">
  <span class="wam-brand">Warm Alpine <b>Modern</b></span>
  <div class="wam-actions">
    <button type="button" id="wam-replay" class="wam-btn wam-btn--ghost" title="Replay intro" aria-label="Replay intro">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="wam-btn-txt">Replay</span>
    </button>
    <a id="wam-pdf" class="wam-btn wam-btn--primary" href="Warm-Alpine-Modern.pdf" download="Warm Alpine Modern — Mood Board.pdf">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="wam-btn-txt">Download PDF</span>
    </a>
  </div>
</header>
